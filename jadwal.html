<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jadwal | Sukma Yoga Studio</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="nav">
    <span class="logo">Sukma Yoga Studio</span>
    <nav aria-label="Menu utama"><ul>
      <li><a href="index.html">Dashboard</a></li>
      <li><a href="paket.html">Paket</a></li>
      <li><a href="jadwal.html" class="active">Jadwal</a></li>
    </ul></nav>
  </div>
</header>

<main>
  <section class="hero">
    <h1>Jadwal kelas</h1>
    <p>Pilih tanggal di kalender. Titik ungu artinya ada kelas di hari itu.</p>
  </section>

  <div class="layout">
    <section class="box" aria-label="Kalender">
      <div class="cal-head">
        <button type="button" id="prev" class="btn-sm" aria-label="Bulan sebelumnya">&lt;</button>
        <h2 id="judul-bulan"></h2>
        <button type="button" id="next" class="btn-sm" aria-label="Bulan berikutnya">&gt;</button>
      </div>
      <div class="cal-grid" id="kalender"></div>
    </section>

    <section class="box" aria-live="polite">
      <h2 id="judul-kelas">Kelas pada tanggal terpilih</h2>
      <p id="info-kelas">Pilih tanggal di kalender untuk melihat kelas yang tersedia.</p>
      <div id="daftar-kelas"></div>
    </section>
  </div>

  <section class="box section-gap sembunyi" id="daftar" aria-labelledby="judul-form">
    <h2 id="judul-form">Pendaftaran kelas</h2>
    <div class="ringkasan" id="ringkasan"></div>

    <form id="form-daftar">
      <label for="nama">Nama lengkap</label>
      <input type="text" id="nama" required>

      <label for="email">Email</label>
      <input type="email" id="email" required>

      <label for="hp">No. HP</label>
      <input type="tel" id="hp" required>

      <label>Pembayaran</label>
      <label class="opsi">
        <input type="radio" name="bayar" value="satuan" checked>
        <span>Bayar 1 credit tanpa member
          <small>Rp 100.000 untuk satu kelas ini</small></span>
      </label>
      <label class="opsi">
        <input type="radio" name="bayar" value="member">
        <span>Pakai credit member
          <small>1 credit dipotong dari paket member kamu</small></span>
      </label>

      <div id="bayar-satuan">
        <label for="metode">Metode pembayaran</label>
        <select id="metode">
          <option>Transfer bank</option>
          <option>QRIS</option>
          <option>E-wallet</option>
        </select>
      </div>

      <div id="bayar-member" class="sembunyi">
        <label for="kode">Kode member</label>
        <input type="text" id="kode" placeholder="Contoh: MBR-001">
      </div>

      <button type="submit">Daftar kelas ini</button>
      <p id="pesan" role="status"></p>
    </form>
  </section>
</main>

<script>
  // Jadwal mingguan. Angka = hari (0 Minggu, 1 Senin, ... 6 Sabtu)
  var KELAS = {
    1: [{ jam: '07.00 - 08.00', nama: 'Hatha Yoga (Pemula)', ins: 'Ayu' }],
    2: [{ jam: '18.30 - 19.30', nama: 'Vinyasa Flow', ins: 'Raka' }],
    3: [{ jam: '07.00 - 08.00', nama: 'Meditasi dan Pernapasan', ins: 'Ayu' },
        { jam: '18.30 - 19.30', nama: 'Hatha Yoga (Pemula)', ins: 'Dewi' }],
    4: [{ jam: '18.30 - 19.30', nama: 'Yin Yoga', ins: 'Dewi' }],
    5: [{ jam: '07.00 - 08.00', nama: 'Vinyasa Flow', ins: 'Raka' }],
    6: [{ jam: '08.00 - 09.30', nama: 'Vinyasa Flow', ins: 'Raka' }],
    0: [{ jam: '08.00 - 09.00', nama: 'Hatha Yoga (Pemula)', ins: 'Dewi' }]
  };
  var HARGA_SATUAN = 'Rp 100.000';
  var NAMA_HARI = ['Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab', 'Min'];

  var hariIni = new Date(); hariIni.setHours(0, 0, 0, 0);
  var bulan = new Date(hariIni.getFullYear(), hariIni.getMonth(), 1);
  var tanggalDipilih = null;
  var kelasDipilih = null;

  function formatTanggal(d) {
    return d.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  }

  function gambarKalender() {
    var grid = document.getElementById('kalender');
    grid.innerHTML = '';
    document.getElementById('judul-bulan').textContent =
      bulan.toLocaleDateString('id-ID', { month: 'long', year: 'numeric' });

    NAMA_HARI.forEach(function (h) {
      var el = document.createElement('div');
      el.className = 'cal-nama';
      el.textContent = h;
      grid.appendChild(el);
    });

    var offset = (bulan.getDay() + 6) % 7; // minggu mulai hari Senin
    for (var i = 0; i < offset; i++) {
      var kosong = document.createElement('div');
      kosong.className = 'cal-kosong';
      grid.appendChild(kosong);
    }

    var jumlah = new Date(bulan.getFullYear(), bulan.getMonth() + 1, 0).getDate();
    for (var tgl = 1; tgl <= jumlah; tgl++) {
      (function (tgl) {
        var d = new Date(bulan.getFullYear(), bulan.getMonth(), tgl);
        var b = document.createElement('button');
        b.type = 'button';
        b.textContent = tgl;
        b.className = 'cal-day';
        if (KELAS[d.getDay()]) b.className += ' ada';
        if (d < hariIni) b.disabled = true;
        if (tanggalDipilih && d.getTime() === tanggalDipilih.getTime()) b.className += ' dipilih';
        b.addEventListener('click', function () { pilihTanggal(d); });
        grid.appendChild(b);
      })(tgl);
    }
  }

  function pilihTanggal(d) {
    tanggalDipilih = d;
    kelasDipilih = null;
    document.getElementById('daftar').classList.add('sembunyi');
    gambarKalender();

    var daftar = document.getElementById('daftar-kelas');
    daftar.innerHTML = '';
    document.getElementById('judul-kelas').textContent = formatTanggal(d);

    var list = KELAS[d.getDay()] || [];
    if (list.length === 0) {
      document.getElementById('info-kelas').textContent = 'Tidak ada kelas di tanggal ini.';
      return;
    }
    document.getElementById('info-kelas').textContent = 'Klik salah satu kelas untuk mendaftar.';

    list.forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'kelas-item';
      b.innerHTML = '<strong>' + k.nama + '</strong><span>' + k.jam + ' bersama ' + k.ins + '</span>';
      b.addEventListener('click', function () {
        document.querySelectorAll('.kelas-item').forEach(function (x) { x.classList.remove('dipilih'); });
        b.classList.add('dipilih');
        pilihKelas(k);
      });
      daftar.appendChild(b);
    });
  }

  function pilihKelas(k) {
    kelasDipilih = k;
    document.getElementById('ringkasan').innerHTML =
      '<strong>' + k.nama + '</strong><br>' + formatTanggal(tanggalDipilih) + ', ' + k.jam + ' bersama ' + k.ins;
    document.getElementById('pesan').style.display = 'none';
    var form = document.getElementById('daftar');
    form.classList.remove('sembunyi');
    form.scrollIntoView({ behavior: 'smooth' });
  }

  // Ganti tampilan sesuai pilihan pembayaran
  document.querySelectorAll('input[name="bayar"]').forEach(function (r) {
    r.addEventListener('change', function () {
      var member = document.querySelector('input[name="bayar"]:checked').value === 'member';
      document.getElementById('bayar-member').classList.toggle('sembunyi', !member);
      document.getElementById('bayar-satuan').classList.toggle('sembunyi', member);
      document.getElementById('kode').required = member;
    });
  });

  // Tampilan saja: data belum disimpan ke server.
  document.getElementById('form-daftar').addEventListener('submit', function (e) {
    e.preventDefault();
    if (!kelasDipilih) return;
    var nama = document.getElementById('nama').value;
    var jenis = document.querySelector('input[name="bayar"]:checked').value;
    var teks = 'Terima kasih, ' + nama + '. Kamu terdaftar di ' + kelasDipilih.nama +
      ' pada ' + formatTanggal(tanggalDipilih) + ', ' + kelasDipilih.jam + '. ';
    if (jenis === 'member') {
      teks += '1 credit dari member ' + document.getElementById('kode').value + ' akan dipotong.';
    } else {
      teks += 'Selesaikan pembayaran ' + HARGA_SATUAN + ' lewat ' + document.getElementById('metode').value + '.';
    }
    var p = document.getElementById('pesan');
    p.textContent = teks;
    p.style.display = 'block';
    this.reset();
    document.getElementById('bayar-member').classList.add('sembunyi');
    document.getElementById('bayar-satuan').classList.remove('sembunyi');
  });

  document.getElementById('prev').addEventListener('click', function () {
    bulan = new Date(bulan.getFullYear(), bulan.getMonth() - 1, 1);
    gambarKalender();
  });
  document.getElementById('next').addEventListener('click', function () {
    bulan = new Date(bulan.getFullYear(), bulan.getMonth() + 1, 1);
    gambarKalender();
  });

  gambarKalender();
</script>

<footer>&copy; 2026 Sukma Yoga Studio. Tugas Cloud Computing.</footer>
</body>
</html>
